TARGET=none         # deploy explicitly with --target run or --target lab
BRANCH=run/canary   # result branch name

# Canary = stable + standing debug instrumentation + whatever is currently being investigated.
# When nothing is in-flight, canary == stable + debug branches.
#
# Note on order: feat/epub-reader-foliate is merged before bug/kobo-popup-v2
# because foliate contains a refactor of cps/kobo.py reading-state queries that
# popup-v2's changes layer on top of. Reversing this order produces real conflicts.
BRANCHES=(
    # Production baseline — keep in sync with stable.conf
    bug/kobo-sync
    feat/kobo-sync-removals
    feat/epub-reader-foliate
    bug/kobo-popup-v2
    feat/series-author-add-shelf
    feat/book-detail-normal-nav
    feat/book-detail-layout

    # Standing debug instrumentation (layered on top so it observes the production code)
    debug/kobo-store-reading-state-locator-logging
    debug/kobo-single-book-trace
    debug/kobo-reading-services-mitm

    # Experimental — append new branches below this line
)
